[project]
name = "lab-manager"
version = "0.1.0"
description = "Learning Factory lab manager"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pyyaml>=6", "asyncpg>=0.29", "argon2-cffi>=23.1", "httpx>=0.27", "websockets>=15"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "asyncpg-stubs",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = ["docker: needs Docker and gVisor (run in CI with -m docker)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Same import grouping on every machine (Windows and CI disagreed without it).
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
