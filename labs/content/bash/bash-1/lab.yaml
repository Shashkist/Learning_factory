id: bash-1
title:
  en: "Bash 1: scripts, loops, conditions and exit codes"
  he: "Bash 1: סקריפטים, לולאות, תנאים וקודי יציאה"
description:
  en: Write your first Bash scripts. Use arguments, a for loop, if/else, a while read loop and exit codes, back up a folder, and meet the classic trap of a file name with a space.
  he: כותבים סקריפטים ראשונים ב-Bash. משתמשים בארגומנטים, בלולאת for, ב-if/else, בלולאת while read ובקודי יציאה, מגבים תיקייה, ופוגשים את המלכודת הקלאסית של שם קובץ עם רווח.
image: term
time_limit_min: 45
internet: false
allow_domains: []
sudo: false
status: published
module: 1
lesson: 6
tasks:
  - id: 01-special-vars
    kind: quiz
    question:
      en: "Inside a Bash script, what do the special variables $?, $# and $1 hold?"
      he: "בתוך סקריפט Bash, מה מחזיקים המשתנים המיוחדים ‎$?‎, ‎$#‎ ו-‎$1‎?"
    options:
      - en: "$? is the number of arguments, $# is the exit status of the last command, $1 is the script name"
        he: "‎$?‎ הוא מספר הארגומנטים, ‎$#‎ הוא קוד היציאה של הפקודה האחרונה, ‎$1‎ הוא שם הסקריפט"
      - en: "$? is the first argument, $# is the process ID, $1 is the result of the last command"
        he: "‎$?‎ הוא הארגומנט הראשון, ‎$#‎ הוא מספר התהליך, ‎$1‎ הוא התוצאה של הפקודה האחרונה"
      - en: "$? is the exit status of the last command, $# is the number of arguments, $1 is the first argument"
        he: "‎$?‎ הוא קוד היציאה של הפקודה האחרונה, ‎$#‎ הוא מספר הארגומנטים, ‎$1‎ הוא הארגומנט הראשון"
      - en: "$? asks the user a question, $# starts a comment, $1 is always the number one"
        he: "‎$?‎ שואל את המשתמש שאלה, ‎$#‎ פותח הערה, ‎$1‎ הוא תמיד המספר אחד"
    correct: 2
  - id: 02-greet
    kind: hands-on
    checklist:
      - en: The script ~/greet.sh exists and is executable
        he: "הסקריפט ‎~/greet.sh‎ קיים וניתן להרצה"
      - en: It prints Hello, and the name it is given, on one line
        he: "הוא מדפיס ‎Hello,‎ ואת השם שקיבל, בשורה אחת"
      - en: It finishes with exit code 0
        he: "הוא מסתיים בקוד יציאה ‎0‎"
  - id: 03-for-loop
    kind: hands-on
    checklist:
      - en: The folder ~/files exists
        he: "התיקייה ‎~/files‎ קיימת"
      - en: It holds the files file1, file2, file3, file4 and file5
        he: "היא מכילה את הקבצים ‎file1‎, ‎file2‎, ‎file3‎, ‎file4‎ ו-‎file5‎"
      - en: It holds nothing else
        he: "אין בה שום דבר אחר"
  - id: 04-exists
    kind: hands-on
    checklist:
      - en: "The script ~/exists.sh starts with #!/bin/bash, exists and is executable"
        he: "הסקריפט ‎~/exists.sh‎ מתחיל ב-‎#!/bin/bash‎, קיים וניתן להרצה"
      - en: It prints found for a path that exists, a file or a folder
        he: "הוא מדפיס ‎found‎ לנתיב שקיים, קובץ או תיקייה"
      - en: It prints missing for a path that does not exist
        he: "הוא מדפיס ‎missing‎ לנתיב שלא קיים"
      - en: It exits with code 0 in both cases
        he: "הוא מסתיים בקוד יציאה ‎0‎ בשני המקרים"
  - id: 05-usage
    kind: hands-on
    checklist:
      - en: "The script ~/usage.sh starts with #!/bin/bash, exists and is executable"
        he: "הסקריפט ‎~/usage.sh‎ מתחיל ב-‎#!/bin/bash‎, קיים וניתן להרצה"
      - en: With no argument it prints the usage line on standard output
        he: "בלי ארגומנט הוא מדפיס את שורת ה-usage לפלט הרגיל"
      - en: With no argument it exits with code 1
        he: "בלי ארגומנט הוא מסתיים בקוד יציאה ‎1‎"
      - en: With one argument it exits with code 0
        he: "עם ארגומנט אחד הוא מסתיים בקוד יציאה ‎0‎"
  - id: 06-count-lines
    kind: hands-on
    checklist:
      - en: "The script ~/count_lines.sh starts with #!/bin/bash, exists and is executable"
        he: "הסקריפט ‎~/count_lines.sh‎ מתחיל ב-‎#!/bin/bash‎, קיים וניתן להרצה"
      - en: It prints the number of lines of a file, and only the number
        he: "הוא מדפיס את מספר השורות של קובץ, ורק את המספר"
      - en: It counts a last line that has no newline at the end
        he: "הוא סופר גם שורה אחרונה שאין בסופה תו שורה חדשה"
      - en: It prints 0 for an empty file and counts blank lines
        he: "הוא מדפיס ‎0‎ לקובץ ריק וסופר גם שורות ריקות"
  - id: 07-backup
    kind: hands-on
    checklist:
      - en: "The script ~/backup.sh starts with #!/bin/bash, exists and is executable"
        he: "הסקריפט ‎~/backup.sh‎ מתחיל ב-‎#!/bin/bash‎, קיים וניתן להרצה"
      - en: Running it creates ~/backup.tar.gz, a compressed archive
        he: "הרצה שלו יוצרת את ‎~/backup.tar.gz‎, ארכיון דחוס"
      - en: The names inside the archive start with notes/
        he: "השמות בתוך הארכיון מתחילים ב-‎notes/‎"
      - en: The archive holds every file that is in ~/notes now, also new ones
        he: "הארכיון מכיל כל קובץ שנמצא עכשיו ב-‎~/notes‎, גם קבצים חדשים"
      - en: Running it again replaces the archive
        he: "הרצה נוספת מחליפה את הארכיון"
  - id: 08-space-trap
    kind: hands-on
    checklist:
      - en: "The script ~/firstline.sh starts with #!/bin/bash, exists and is executable"
        he: "הסקריפט ‎~/firstline.sh‎ מתחיל ב-‎#!/bin/bash‎, קיים וניתן להרצה"
      - en: It prints the first line of a file
        he: "הוא מדפיס את השורה הראשונה של קובץ"
      - en: It also works when the file name has a space in it
        he: "הוא עובד גם כששם הקובץ כולל רווח"
