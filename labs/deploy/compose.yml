# The lf-manager service. .github/workflows/deploy.yml copies this file to the server, and
# labs/deploy/deploy.sh runs
#   docker compose -p learning-factory -f compose.yml up -d
# with LF_MANAGER_TAG (a commit sha), LF_NGINX_NETWORK and LF_TRUSTED_PROXY exported. deploy.sh
# also writes /root/learning-factory/.env (mode 600): LF_ID_SECRET is generated once on the
# server, LF_DATABASE_URL comes from the production environment secret on ssh stdin. No agent
# ever prints or reads those values.
name: learning-factory

services:
  lf-manager:
    container_name: lf-manager
    image: ghcr.io/shashkist/lf-manager:${LF_MANAGER_TAG:-latest}
    restart: unless-stopped
    env_file: /root/learning-factory/.env
    environment:
      LF_LOGIN_IP_LIMIT: "100"
      LF_TRUSTED_PROXY: ${LF_TRUSTED_PROXY:?LF_TRUSTED_PROXY must be set}
      LF_LAB_NETWORK: lf-labs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      nginx:
        gw_priority: 100
      lf-labs:
        ipv4_address: 172.31.240.2

networks:
  nginx:
    name: ${LF_NGINX_NETWORK:?LF_NGINX_NETWORK must be set}
    external: true
  lf-labs:
    external: true
