# BEGIN learning-factory:labs
# Learning Factory (Shashkist/Learning_factory). Installed by labs/deploy/nginx/install-block.sh; edit it in that repo.
server {
    listen 443 ssl;
    server_name labs.shashkist.com;

    ssl_certificate /etc/letsencrypt/live/teams.shashkist.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teams.shashkist.com/privkey.pem;

    add_header X-Robots-Tag "noindex" always;

    # Docker's embedded DNS, resolved per request through a variable: nginx starts and reloads
    # even when lf-manager is not (yet) running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://lf-manager:8000;

    location / {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten with the socket address, never appended: the manager rate-limits on it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No access log for the OAuth callback: its query string carries the one-time code and state.
    location = /auth/google/callback {
        access_log off;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /s/ {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
# END learning-factory:labs
