# BEGIN learning-factory:factory
# Learning Factory (Shashkist/Learning_factory). Installed by labs/deploy/nginx/install-block.sh; edit it in that repo.
server {
    listen 443 ssl;
    server_name factory.shashkist.com;

    ssl_certificate /etc/letsencrypt/live/teams.shashkist.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teams.shashkist.com/privkey.pem;

    root /var/www/static/factory;
    index index.html;
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /snapshot.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /live.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
# END learning-factory:factory
