[project]
name = "factory-dashboard"
version = "0.1.0"
description = "Learning Factory dashboard: snapshot builder and static page"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "pyyaml>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["build_snapshot.py"]
