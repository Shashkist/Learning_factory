name: Factory dashboard

on:
  schedule:
    # Every 15 minutes (D71), off the quarter hours (D73): busy minutes get dropped.
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    # Only what the snapshot reads or the page ships (#98): state docs and dashboard code.
    paths:
      - "docs/factory/**"
      - "labs/factory-dashboard/**"
      - ".github/workflows/factory-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: factory-dashboard
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The dashboard is built by the factory package at a pinned commit. The pin is a full SHA;
      # changing it is a PR in this repo (D149). This job has no secrets (factory D12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Shashkist/factory
          ref: 52280d7a3126a4799273721405dffea319385534
          path: factory-src
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      # Only the factory's locked runtime dependencies (uv.lock, with hashes); the package itself
      # is not built or installed, so no build backend is fetched. It runs from its source tree.
      - name: Install the factory's locked dependencies
        env:
          # Use the runner's Python 3.12 from setup-python; never download an interpreter.
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --frozen --no-dev --no-install-project --project factory-src
      - name: Build the dashboard site
        env:
          GH_TOKEN: ${{ github.token }}
          UV_PYTHON_DOWNLOADS: never
        run: PYTHONPATH=factory-src/src uv run --frozen --no-sync --project factory-src python -m factory_tools.dashboard build --repos docs/factory/repos.yaml --out site/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-dashboard
          path: site/
          retention-days: 7

  publish:
    # Only main can deploy to the production environment (branch policy), and only main runs this job.
    needs: snapshot
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-dashboard
          path: site/
      - name: Publish to factory.shashkist.com
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST_KEY: ${{ vars.SERVER_HOST_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ]; then
            echo "publish skipped: SSH_PRIVATE_KEY, SERVER_HOST or SERVER_USER not set"
            exit 0
          fi
          if [ -z "$SERVER_HOST_KEY" ]; then
            echo "repo variable SERVER_HOST_KEY is not set: refusing to trust an unknown host key" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/publish_key"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          printf '%s %s\n' "$SERVER_HOST" "$SERVER_HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          ssh_opts="-i $key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          # One TCP connection for all three commands: the server refuses bursts of new SSH
          # connections (incident #26).
          ssh_opts="$ssh_opts -o ControlMaster=auto -o ControlPath=$RUNNER_TEMP/cm-%C -o ControlPersist=60"
          dest=/root/static/factory
          for attempt in 1 2 3; do
            ssh $ssh_opts "$SERVER_USER@$SERVER_HOST" "mkdir -p $dest/.incoming" && break
            if [ "$attempt" = 3 ]; then echo "ssh failed 3 times" >&2; exit 1; fi
            echo "ssh attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          scp $ssh_opts site/index.html site/app.js site/styles.css site/theme.js site/snapshot.json \
            "$SERVER_USER@$SERVER_HOST:$dest/.incoming/"
          ssh $ssh_opts "$SERVER_USER@$SERVER_HOST" \
            "cd $dest/.incoming && mv index.html app.js styles.css theme.js $dest/ && mv snapshot.json $dest/"
          echo "published to $dest"
      - name: Remove the publish key
        if: always()
        run: rm -f "$RUNNER_TEMP/publish_key" "$RUNNER_TEMP/known_hosts"
