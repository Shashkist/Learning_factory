name: Server bootstrap

# Prepares the lab host (runsc, swap, lf-labs network, DOCKER-USER rules). It changes the shared
# production server, so it is never scheduled: a manual dispatch, or a push to main that touches
# labs/deploy/bootstrap/**. Both start as a dry run unless the dispatch input `apply` is true or
# a line of the head commit message is exactly "[bootstrap apply]".

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the changes (default: dry run, nothing is changed)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "labs/deploy/bootstrap/**"

permissions:
  contents: read

concurrency:
  group: server-lab-host
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run bootstrap.sh on the server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST_KEY: ${{ vars.SERVER_HOST_KEY }}
          INPUT_APPLY: ${{ inputs.apply }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ]; then
            echo "SSH_PRIVATE_KEY, SERVER_HOST or SERVER_USER not set in the production environment" >&2
            exit 1
          fi
          if [ -z "$SERVER_HOST_KEY" ]; then
            echo "repo variable SERVER_HOST_KEY is not set: refusing to trust an unknown host key" >&2
            exit 1
          fi
          DRY_RUN=1
          if [ "$INPUT_APPLY" = "true" ]; then DRY_RUN=0; fi
          if printf '%s\n' "$HEAD_COMMIT_MESSAGE" | grep -qFx '[bootstrap apply]'; then DRY_RUN=0; fi
          echo "mode: $([ "$DRY_RUN" = 1 ] && echo 'dry run' || echo 'apply')"

          key="$RUNNER_TEMP/bootstrap_key"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          printf '%s %s\n' "$SERVER_HOST" "$SERVER_HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          ssh_opts="-i $key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          # One TCP connection for all commands: the server refuses bursts of new SSH
          # connections (incident #26).
          ssh_opts="$ssh_opts -o ControlMaster=auto -o ControlPath=$RUNNER_TEMP/cm-%C -o ControlPersist=120"
          # Every run has its own directory (script, log, exit code): a run still alive on the
          # server never has its script, log or exit-code file replaced by a later run.
          dest=/root/lf-bootstrap/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          for attempt in 1 2 3; do
            ssh $ssh_opts "$SERVER_USER@$SERVER_HOST" "mkdir -p $dest" && break
            if [ "$attempt" = 3 ]; then echo "ssh failed 3 times" >&2; exit 1; fi
            echo "ssh attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          # A bootstrap still running on the server (a cancelled job leaves it running) holds this
          # lock. Stop before copying or launching anything.
          lock_st=0
          ssh $ssh_opts "$SERVER_USER@$SERVER_HOST" "flock -n /run/lf-bootstrap.lock true" || lock_st=$?
          if [ "$lock_st" != 0 ]; then
            if [ "$lock_st" = 255 ]; then
              echo "ssh failed while checking the bootstrap lock" >&2
            else
              echo "a bootstrap is still running on the server (lock /run/lf-bootstrap.lock is held); nothing was copied or started" >&2
              # Show the log of the newest run directory without bootstrap.rc (the run that holds the
              # lock), skipping finished runs, this run's own directory and empty directories left by refused
              # runs; then remove this run's own empty directory (best effort). Nothing else is touched.
              orphan="for d in \$(ls -1dt ${dest%/*}/run-*/ 2>/dev/null); do d=\${d%/}; [ \"\$d\" = $dest ] && continue; [ -e \"\$d/bootstrap.log\" ] || continue; [ -e \"\$d/bootstrap.rc\" ] && continue; echo \"-- log of the unfinished run \$d (last 200 lines)\"; tail -n 200 \"\$d/bootstrap.log\" 2>/dev/null; break; done; rmdir $dest 2>/dev/null || true"
              ssh $ssh_opts "$SERVER_USER@$SERVER_HOST" "$orphan" || true
            fi
            exit 1
          fi
          scp $ssh_opts labs/deploy/bootstrap/bootstrap.sh "$SERVER_USER@$SERVER_HOST:$dest/bootstrap.sh"
          # The script runs detached on the server (its own session, immune to HUP): a dropped SSH
          # session or a cancelled workflow must never cut a run (or its rollback) short. Its output
          # goes to a log, its exit code to a file. The script prints no secret.
          launch="setsid nohup bash -c 'DRY_RUN=$DRY_RUN LF_BASELINE_URLS=\"https://n8n.shashkist.com https://pulsesign.shashkist.com https://jsoul.app\" LF_BASELINE_TCP=127.0.0.1:18789 bash $dest/bootstrap.sh > $dest/bootstrap.log 2>&1; echo \$? > $dest/bootstrap.rc' > /dev/null 2>&1 < /dev/null &"
          ssh $ssh_opts "$SERVER_USER@$SERVER_HOST" "$launch"
          # Follow the log until the exit-code file appears (at most 45 minutes). If the SSH session
          # drops, the script keeps running: reattach, which replays the log from its start.
          follow="tail -F -n +1 $dest/bootstrap.log & t=\$!; end=\$((\$(date +%s)+2700)); while [ ! -f $dest/bootstrap.rc ]; do if [ \$(date +%s) -gt \$end ]; then echo 'no result after 45 minutes' >&2; kill \$t; exit 1; fi; sleep 3; done; sleep 2; kill \$t; exit 0"
          for attempt in 1 2 3 4 5 6; do
            st=0
            ssh $ssh_opts "$SERVER_USER@$SERVER_HOST" "$follow" || st=$?
            if [ "$st" != 255 ]; then break; fi
            echo "lost the SSH connection to the log (attempt $attempt); the script keeps running on the server; reattaching in 20 s"
            sleep 20
          done
          # The job fails when the script failed: read its exit code back.
          rc="$(ssh $ssh_opts "$SERVER_USER@$SERVER_HOST" "cat $dest/bootstrap.rc 2>/dev/null" || true)"
          echo "bootstrap.sh exit code: ${rc:-unknown}"
          if [ "$rc" != 0 ]; then
            echo "the bootstrap did not finish with exit code 0 (BOOTSTRAP RESULT in the log above)" >&2
            exit 1
          fi
      - name: Remove the SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/bootstrap_key" "$RUNNER_TEMP/known_hosts"
