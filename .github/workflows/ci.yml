name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Docs-only pushes run no CI (#271). Keep in step with DOCS_ONLY in scripts/ci_paths.py:
    # Deploy treats exactly these paths as docs when it compares code trees. PRs stay unfiltered.
    paths-ignore:
      - "docs/**"
      - "courses/**"
      - ".claude/**"
      - "history.md"

permissions:
  contents: read

# A newer push to a PR cancels that PR's older run. Pushes to main get a group
# per commit, so main runs never cancel or queue behind each other (#98).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The manager checks are split in two parallel jobs so the acceptance exam runs once,
  # not twice, and the wall time is the longer of the two (#364, D116).
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: labs/manager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff check ../deploy/smoke
      - run: uv run mypy app
      - run: uv run pytest -q --ignore=tests/acceptance

  # The exam runs through the factory's reusable junit-gate (#613, D165): checks are
  # `manager-exam / exam` and `manager-exam / gate`. The reusable exam job has no services,
  # so postgres:16 is started here. confcutdir and the addopts override keep conftest.py
  # files above tests/ and pyproject addopts from skipping or deselecting exam tests.
  # The reusable job sets PYTEST_DISABLE_PLUGIN_AUTOLOAD=1; the manager exam needs no plugin.
  manager-exam:
    uses: Shashkist/factory/.github/workflows/junit-gate.yml@95753bb72e9c5d885376311efea91db7272f9d16 # v0.1.0
    with:
      timeout-minutes: 25
      junit-file: labs/manager/acceptance.xml
      test-command: |
        set -euo pipefail
        docker run -d --name lf-exam-postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16
        for i in $(seq 1 30); do
          if docker exec lf-exam-postgres pg_isready -U postgres; then break; fi
          sleep 2
        done
        docker exec lf-exam-postgres pg_isready -U postgres
        export LF_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres
        cd labs/manager
        uv sync
        uv run pytest tests/acceptance -q --confcutdir=tests -o addopts="" -m "not docker" --junitxml=acceptance.xml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: labs/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (fake backend)
        run: npm run e2e
      - name: Design checks and screenshots
        if: ${{ hashFiles('labs/web/tests/acceptance/playwright.design.config.ts') != '' }}
        run: npx playwright test -c tests/acceptance/playwright.design.config.ts
      - name: Upload design screenshots
        if: ${{ always() && hashFiles('labs/web/tests/acceptance/playwright.design.config.ts') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-screenshots
          path: labs/web/test-results/design-screenshots/

  # Decides whether a PR needs the docker and image jobs (#271). The repository has no
  # required checks (main is not protected), so a skipped job does not block a merge.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.heavy.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Does the change touch images, manager, deploy, content or workflows
        id: heavy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q origin "$BASE_REF"
          # The base branch's copy decides, so a PR cannot skip its own docker exam by editing HEAVY.
          script=scripts/ci_paths.py   # bootstrap: the base has no copy yet
          if git show "origin/$BASE_REF:scripts/ci_paths.py" > "$RUNNER_TEMP/ci_paths.py" 2>/dev/null; then
            script="$RUNNER_TEMP/ci_paths.py"
          fi
          heavy=$(python3 -I "$script" heavy "origin/$BASE_REF" "$HEAD_SHA")
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  docker:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    # About 8 minutes when the mirrors answer. The term image build is bounded
    # (#228), so a hung mirror fails fast instead of holding the runner 70+ min.
    timeout-minutes: 33
    env:
      # the runners' own mirror first, archive.ubuntu.com as fallback (#545)
      LF_APT_MIRRORS: http://azure.archive.ubuntu.com/ubuntu/
    defaults:
      run:
        working-directory: labs/manager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gVisor runsc and register it with Docker
        working-directory: .
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl reload docker || sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      # Docker-marked unit tests only; the docker-marked exams run once, in the gate below.
      - run: uv run pytest -q -m docker tests/unit
      # The browser flow against the real manager (#167) needs the built UI and one Chromium.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: labs/web/package-lock.json
      - name: Install web dependencies
        working-directory: labs/web
        run: npm ci
      - name: Build the web app for the browser exam
        working-directory: labs/web
        run: npm run build
      - name: Install Chromium for the browser exam
        working-directory: labs/web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Docker-marked acceptance exam must not skip
        run: |
          # Strict (#243): no exit-5 pass and no --allow-empty. If a marker rename
          # left no docker exam to run, the job fails instead of going green.
          # Stop pytest (SIGINT) well before the 33-minute job limit (the steps before this
          # take ~2 min since #167), so it still prints the failures so far and writes the report; the step then fails (124).
          timeout -s INT -k 60 26m uv run pytest tests/acceptance -q --confcutdir=tests -o addopts="" -m docker --junitxml=docker-acceptance.xml
          python3 ../../scripts/ci/junit_gate.py docker-acceptance.xml

  image-term:
    # Queue per ref. This does not order runs (a run enters the group only when its docker job ends, and a pending job can be replaced), so :latest is pushed only while main's code is still this commit's (D154).
    concurrency:
      group: image-term-${{ github.ref }}
      cancel-in-progress: false
    # Push only an image whose docker exam job passed.
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build lf-lab-term
        run: docker build --build-arg APT_MIRRORS=http://azure.archive.ubuntu.com/ubuntu/ -t ghcr.io/shashkist/lf-lab-term:${{ github.sha }} -t ghcr.io/shashkist/lf-lab-term:latest labs/images/term
      - name: Smoke test under production run flags
        run: |
          out=$(docker run --rm --cap-drop ALL --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges --entrypoint su ghcr.io/shashkist/lf-lab-term:${{ github.sha }} - student -c 'id -un; man -w ls')
          echo "$out"
          echo "$out" | head -n1 | grep -qx student
          echo "$out" | tail -n1 | grep -q '/usr/share/man/.*ls'
      - name: Check the built image has the stock apt sources back (#545)
        run: |
          docker run --rm --entrypoint sh ghcr.io/shashkist/lf-lab-term:${{ github.sha }} -c "grep -q '^URIs: http://archive.ubuntu.com/ubuntu/' /etc/apt/sources.list.d/ubuntu.sources && grep -q '^URIs: http://security.ubuntu.com/ubuntu/' /etc/apt/sources.list.d/ubuntu.sources && ! grep -q mirror+file /etc/apt/sources.list.d/ubuntu.sources && ! test -e /etc/apt/lf-mirrors.txt && ! test -e /etc/apt/ubuntu.sources.lf-orig && ! ls /var/lib/apt/lists/ | grep -q -e InRelease -e Packages"
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push lf-lab-term
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SHA: ${{ github.sha }}
        run: |
          docker push ghcr.io/shashkist/lf-lab-term:"$SHA"
          # :latest only while main's code is still this commit's (same rule as Deploy, D154).
          # The checkout is shallow and ci_paths needs the history between the two commits.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch -q --no-tags --unshallow origin main
          else
            git fetch -q --no-tags origin main
          fi
          git show origin/main:scripts/ci_paths.py > "$RUNNER_TEMP/ci_paths.py"
          may=$(python3 -I "$RUNNER_TEMP/ci_paths.py" deploys "$SHA" origin/main)
          if [ "$may" = true ]; then
            docker push ghcr.io/shashkist/lf-lab-term:latest
            echo "lf-lab-term:latest pushed: $SHA is still main's code"
          else
            echo "lf-lab-term:latest skipped: main's code has moved past $SHA (a newer run pushes it)"
          fi

  image-manager:
    # Queue per ref. This does not order runs (a run enters the group only when its docker job ends, and a pending job can be replaced), so :latest is pushed only while main's code is still this commit's (D154).
    concurrency:
      group: image-manager-${{ github.ref }}
      cancel-in-progress: false
    # Push only an image whose docker exam job passed.
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build lf-manager
        run: docker build -f labs/manager/Dockerfile -t ghcr.io/shashkist/lf-manager:${{ github.sha }} -t ghcr.io/shashkist/lf-manager:latest labs
      - name: Smoke test (no database, no docker socket)
        run: |
          trap 'docker rm -f lf-manager-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name lf-manager-smoke -p 127.0.0.1:18000:8000 ghcr.io/shashkist/lf-manager:${{ github.sha }}
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then docker logs lf-manager-smoke; exit 1; fi
          curl -fsS -i http://127.0.0.1:18000/ | grep -i '^content-type: text/html'
      - name: Validate the compose file
        env:
          LF_TRUSTED_PROXY: 127.0.0.1
          LF_NGINX_NETWORK: placeholder-network
        run: |
          sudo mkdir -p /root/learning-factory && sudo touch /root/learning-factory/.env
          # sudo drops the environment (and -E is refused on the runner): pass the two placeholders explicitly
          sudo LF_TRUSTED_PROXY="$LF_TRUSTED_PROXY" LF_NGINX_NETWORK="$LF_NGINX_NETWORK" docker compose -f labs/deploy/compose.yml config --quiet
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push lf-manager
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SHA: ${{ github.sha }}
        run: |
          docker push ghcr.io/shashkist/lf-manager:"$SHA"
          # :latest only while main's code is still this commit's (same rule as Deploy, D154).
          # The checkout is shallow and ci_paths needs the history between the two commits.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch -q --no-tags --unshallow origin main
          else
            git fetch -q --no-tags origin main
          fi
          git show origin/main:scripts/ci_paths.py > "$RUNNER_TEMP/ci_paths.py"
          may=$(python3 -I "$RUNNER_TEMP/ci_paths.py" deploys "$SHA" origin/main)
          if [ "$may" = true ]; then
            docker push ghcr.io/shashkist/lf-manager:latest
            echo "lf-manager:latest pushed: $SHA is still main's code"
          else
            echo "lf-manager:latest skipped: main's code has moved past $SHA (a newer run pushes it)"
          fi

  # The factory's reusable check (#613, D165). exam-paths reproduce _is_exam in
  # scripts/ci/exam_integrity.py: everything under labs/<lab>/tests/ except tests/unit/.
  # The factory's fnmatch `*` crosses `/`, so the character classes keep tests/unit/
  # out while tests/unit_extra/ stays exam. The globs name no lab, so a new lab
  # directory needs no edit. Pytest config files (conftest.py, pytest.ini, ...) count
  # as exam outside tests/unit/ by the reusable check's own rule.
  exam-integrity:
    if: github.event_name == 'pull_request'
    uses: Shashkist/factory/.github/workflows/exam-integrity.yml@95753bb72e9c5d885376311efea91db7272f9d16 # v0.1.0
    with:
      exam-paths: |
        labs/*/tests/[!u]*
        labs/*/tests/u[!n]*
        labs/*/tests/un[!i]*
        labs/*/tests/uni[!t]*
        labs/*/tests/unit[!/]*
      ci-paths: |
        .github/workflows/ci.yml
        scripts/ci/**

  # Factory tooling tests (progress, crew, issue lock, guard). A job of their
  # own: code from the PR never runs before the exam-integrity check above, and
  # a failing tooling test cannot hide that check's verdict (#249).
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Code fetched from outside this repository runs in this job.
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Unit tests for the factory tooling in scripts/
        run: uvx pytest scripts -q
      - name: Lint the check scripts (their tests ran in the step above)
        run: |
          uvx ruff check scripts/ci
      - name: Project profile check (.factory/factory.yaml)
        run: uvx --from git+https://github.com/Shashkist/factory@95753bb72e9c5d885376311efea91db7272f9d16 factory-tools profile check .factory/factory.yaml # v0.1.0
