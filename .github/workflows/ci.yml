name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: labs/manager
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -q
      - name: Acceptance exam must run fully (no skips)
        # confcutdir and the addopts override keep conftest.py files above tests/
        # and pyproject addopts from skipping or deselecting exam tests.
        run: |
          uv run pytest tests/acceptance -q --confcutdir=tests -o addopts="" -m "not docker" --junitxml=acceptance.xml
          python3 ../../scripts/ci/junit_gate.py acceptance.xml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: labs/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/manager
    steps:
      - uses: actions/checkout@v4
      - name: Install gVisor runsc and register it with Docker
        working-directory: .
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl reload docker || sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q -m docker
      - name: Docker-marked acceptance exam must not skip
        run: |
          rc=0
          uv run pytest tests/acceptance -q --confcutdir=tests -o addopts="" -m docker --junitxml=docker-acceptance.xml || rc=$?
          # 5 = no docker-marked exam tests yet; the gate below still checks the report
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi
          python3 ../../scripts/ci/junit_gate.py docker-acceptance.xml --allow-empty

  image-term:
    # Push only an image whose docker exam job passed.
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build lf-lab-term
        run: docker build -t ghcr.io/shashkist/lf-lab-term:${{ github.sha }} -t ghcr.io/shashkist/lf-lab-term:latest labs/images/term
      - name: Smoke test under production run flags
        run: |
          out=$(docker run --rm --cap-drop ALL --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges --entrypoint su ghcr.io/shashkist/lf-lab-term:${{ github.sha }} - student -c 'id -un; man -w ls')
          echo "$out"
          echo "$out" | head -n1 | grep -qx student
          echo "$out" | tail -n1 | grep -q '/usr/share/man/.*ls'
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push lf-lab-term
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/shashkist/lf-lab-term:${{ github.sha }}
          docker push ghcr.io/shashkist/lf-lab-term:latest

  image-manager:
    # Push only an image whose docker exam job passed.
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build lf-manager
        run: docker build -f labs/manager/Dockerfile -t ghcr.io/shashkist/lf-manager:${{ github.sha }} -t ghcr.io/shashkist/lf-manager:latest labs
      - name: Smoke test (no database, no docker socket)
        run: |
          trap 'docker rm -f lf-manager-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name lf-manager-smoke -p 127.0.0.1:18000:8000 ghcr.io/shashkist/lf-manager:${{ github.sha }}
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then docker logs lf-manager-smoke; exit 1; fi
          curl -fsS -i http://127.0.0.1:18000/ | grep -i '^content-type: text/html'
      - name: Validate the compose file
        env:
          LF_TRUSTED_PROXY: 127.0.0.1
          LF_NGINX_NETWORK: placeholder-network
        run: |
          sudo mkdir -p /root/learning-factory && sudo touch /root/learning-factory/.env
          # sudo drops the environment (and -E is refused on the runner): pass the two placeholders explicitly
          sudo LF_TRUSTED_PROXY="$LF_TRUSTED_PROXY" LF_NGINX_NETWORK="$LF_NGINX_NETWORK" docker compose -f labs/deploy/compose.yml config --quiet
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push lf-manager
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/shashkist/lf-manager:${{ github.sha }}
          docker push ghcr.io/shashkist/lf-manager:latest

  exam-integrity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Lint and unit tests for the check scripts
        run: |
          uvx ruff check scripts/ci
          uvx pytest scripts/ci -q
      - name: Exam integrity per commit
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch -q origin "$BASE_REF"
          base="origin/$BASE_REF"
          flag=""
          # Run the base branch copy so a PR cannot weaken its own check.
          if git show "$base:scripts/ci/exam_integrity.py" > "$RUNNER_TEMP/ei.py" 2>/dev/null; then
            script="$RUNNER_TEMP/ei.py"
          else
            script=scripts/ci/exam_integrity.py   # bootstrap: base has no script yet
            flag="--bootstrap"
          fi
          python "$script" "$base" "$HEAD_SHA" $flag
