name: Server smoke

# Checks against the shared production server.
# check=isolation runs labs/deploy/smoke/isolation.sh: throw-away lf-smoke-* containers on the
# lab network prove that labs reach nothing but the manager's 7681 path (issue #3).
# check=liveness runs labs/deploy/smoke/liveness.sh: a diagnostic of lab containers that exit after
# a docker exec (throw-away lf-smoke-live-* containers, read-only otherwise).
# check=terminal opens a real terminal through https://labs.shashkist.com as a synthetic smoke
# student (issue #86, D36). It runs by hand, nightly, and as a job of every Deploy run that really
# deployed (workflow_call from deploy.yml, issue #90, D38).
# The class password of the smoke student is generated per run and never stored.

on:
  workflow_dispatch:
    inputs:
      check:
        description: "Which smoke to run"
        type: choice
        options: [isolation, liveness, terminal]
        default: isolation
  workflow_call:
    inputs:
      from_deploy:
        description: "Called by the Deploy run, which already holds the host lock"
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  # A scheduled or manual smoke must not queue behind a Deploy: GitHub keeps one pending run per
  # concurrency group, so a queued smoke could cancel a pending Deploy. No concurrency here.
  gate:
    if: ${{ !inputs.from_deploy }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      deploy_busy: ${{ steps.check.outputs.deploy_busy }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Look for a Deploy run that is queued, waiting or running
        id: check
        run: |
          busy=$(gh run list --workflow deploy.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "waiting" or .status == "in_progress" or .status == "requested" or .status == "pending")] | length')
          if [ "${busy:-0}" != 0 ]; then
            echo "Smoke skipped: a Deploy run is queued, waiting or in progress"
            echo "deploy_busy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_busy=false" >> "$GITHUB_OUTPUT"
          fi
  smoke:
    needs: gate
    # A called run (from Deploy) skips the gate; scheduled and manual runs need a quiet Deploy.
    if: >-
      ${{ !cancelled() && (inputs.from_deploy ||
      (needs.gate.result == 'success' && needs.gate.outputs.deploy_busy != 'true')) }}
    # Shared with bootstrap.yml and deploy.yml (D30). A called run already runs under the Deploy
    # run's lock and must not wait for it, so it gets a group of its own.
    concurrency:
      group: ${{ inputs.from_deploy && format('server-smoke-called-{0}', github.run_id) || 'server-lab-host' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      # events without inputs (workflow_call, schedule) run the terminal check
      CHECK: ${{ inputs.check || 'terminal' }}
    steps:
      - uses: actions/checkout@v4
      # Outside code (setup-python, pip) runs before the server key exists on the runner.
      - uses: actions/setup-python@v5
        if: env.CHECK == 'terminal'
        with:
          python-version: "3.12"
      - name: Install the client dependency (hash-pinned)
        if: env.CHECK == 'terminal'
        run: python -m pip install --quiet --require-hashes --only-binary=":all:" -r labs/deploy/smoke/requirements.txt
      - name: Configure SSH to the server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST_KEY: ${{ vars.SERVER_HOST_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_HOST_KEY" ]; then
            echo "deploy secrets or SERVER_HOST_KEY missing in the production environment" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/smoke_key"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s %s\n' "$SERVER_HOST" "$SERVER_HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          # One TCP connection for all commands of all steps (the server refuses bursts, incident #26).
          {
            echo "Host smoke"
            echo "  HostName $SERVER_HOST"
            echo "  User $SERVER_USER"
            echo "  IdentityFile $key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $RUNNER_TEMP/known_hosts"
            echo "  ControlMaster auto"
            echo "  ControlPath $RUNNER_TEMP/cm-%C"
            echo "  ControlPersist 600"
          } > "$RUNNER_TEMP/ssh_config"
          for attempt in 1 2 3; do
            ssh -F "$RUNNER_TEMP/ssh_config" smoke true && break
            if [ "$attempt" = 3 ]; then echo "ssh failed 3 times" >&2; exit 1; fi
            sleep 20
          done
      - name: Run the smoke on the server
        if: env.CHECK != 'terminal'
        run: |
          case "$CHECK" in isolation) script=labs/deploy/smoke/isolation.sh ;; liveness) script=labs/deploy/smoke/liveness.sh ;; *) echo "unknown check" >&2; exit 1 ;; esac
          cfg="$RUNNER_TEMP/ssh_config"
          dest=/root/lf-smoke/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          ssh -F "$cfg" smoke "mkdir -p $dest"
          scp -F "$cfg" "$script" "smoke:$dest/smoke.sh"
          st=0
          ssh -F "$cfg" smoke "timeout 600 bash $dest/smoke.sh" || st=$?
          ssh -F "$cfg" smoke "rm -rf $dest" || true
          exit "$st"
      - name: Enable the smoke student and open a terminal through the production path
        id: client
        if: env.CHECK == 'terminal'
        run: |
          # The per-run class password lives only in this step's shell: masked, sent on stdin to
          # the manager, and given to the client in its own environment. Never stored.
          class_pw=$(openssl rand -hex 24)
          echo "::add-mask::$class_pw"
          ssh -F "$RUNNER_TEMP/ssh_config" smoke "docker exec -i lf-manager python -m app.cli smoke-student" <<< "$class_pw"
          SMOKE_ID=990000000000000000000000000001
          SMOKE_PASSWORD="$class_pw"
          export SMOKE_ID SMOKE_PASSWORD
          # Both clients are streamed to the log as they run and bounded below the job limit; the
          # session ids are read from files afterwards, so they are recorded even when the limit
          # cuts a smoke off.
          set +e
          timeout -k 10 300 python labs/deploy/smoke/terminal.py | tee "$RUNNER_TEMP/terminal.out"
          st=${PIPESTATUS[0]}
          set -e
          sid=$(grep -E -m 1 '^[0-9a-f-]+$' "$RUNNER_TEMP/terminal.out" || true)
          echo "sid=$sid" >> "$GITHUB_OUTPUT"
          if [ "$st" = 124 ] || [ "$st" = 137 ]; then
            echo "terminal smoke cut off after 300 s" >&2
          fi
          if [ "$st" = 0 ] && [ -z "$sid" ]; then
            echo "the client reported success but gave no session id" >&2
            exit 1
          fi
          if [ "$st" = 0 ]; then
            # Same student, same env: the task API (show, check, answer) through the public URL.
            set +e
            timeout -k 10 300 python labs/deploy/smoke/tasks.py | tee "$RUNNER_TEMP/tasks.out"
            st=${PIPESTATUS[0]}
            set -e
            if [ "$st" = 124 ] || [ "$st" = 137 ]; then
              echo "task smoke cut off after 300 s" >&2
            fi
            tasks_sid=$(sed -n 's/^ok start \([0-9a-f-]*\)$/\1/p' "$RUNNER_TEMP/tasks.out" | head -n 1)
            echo "tasks_sid=$tasks_sid" >> "$GITHUB_OUTPUT"
          fi
          exit "$st"
      - name: Check that the lab container is gone
        if: always() && env.CHECK == 'terminal' && (steps.client.outputs.sid != '' || steps.client.outputs.tasks_sid != '')
        env:
          SESSION_ID: ${{ steps.client.outputs.sid }}
          TASKS_SESSION_ID: ${{ steps.client.outputs.tasks_sid }}
        run: |
          rc=0
          for sid in $SESSION_ID $TASKS_SESSION_ID; do
            gone=0
            for i in $(seq 1 30); do
              left=$(ssh -F "$RUNNER_TEMP/ssh_config" smoke "docker ps -aq --filter name=lab-$sid")
              if [ -z "$left" ]; then
                echo "container lab-$sid is gone"
                gone=1
                break
              fi
              sleep 1
            done
            if [ "$gone" = 0 ]; then
              echo "container lab-$sid still exists after 30 s" >&2
              rc=1
            fi
          done
          exit "$rc"
      - name: Disable the smoke student
        if: always() && env.CHECK == 'terminal'
        run: |
          if [ ! -f "$RUNNER_TEMP/ssh_config" ]; then
            echo "ssh was never configured; nothing to disable"
            exit 0
          fi
          ssh -F "$RUNNER_TEMP/ssh_config" smoke "docker exec lf-manager python -m app.cli smoke-student --disable" < /dev/null
      - name: Remove the SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/smoke_key" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/ssh_config"
