name: Dashboard CI

on:
  pull_request:
    paths:
      - "labs/factory-dashboard/**"
      - "labs/deploy/nginx/**"
      # The #25 exam reads every workflow file, so any workflow change runs it (#400).
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/ci/junit_gate.py"
      - "scripts/factory_progress.py"
      - "scripts/_hook_io.py"
  push:
    branches: [main]
    paths:
      - "labs/factory-dashboard/**"
      - "labs/deploy/nginx/**"
      # The #25 exam reads every workflow file, so any workflow change runs it (#400).
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/ci/junit_gate.py"
      - "scripts/factory_progress.py"
      - "scripts/_hook_io.py"

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/factory-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy build_snapshot.py
      - run: uv run pytest -q
      - name: Acceptance exam must run fully (no skips)
        run: |
          uv run pytest tests/acceptance -q --confcutdir=tests -o addopts="" --junitxml=acceptance.xml
          python3 ../../scripts/ci/junit_gate.py acceptance.xml
