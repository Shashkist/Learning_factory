name: Dashboard CI

on:
  pull_request:
    paths:
      - "labs/factory-dashboard/**"
      - "labs/deploy/nginx/**"
      # The #25 exam reads every workflow file, so any workflow change runs it (#400).
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/ci/junit_gate.py"
      - "scripts/factory_progress.py"
      - "scripts/_hook_io.py"
  push:
    branches: [main]
    paths:
      - "labs/factory-dashboard/**"
      - "labs/deploy/nginx/**"
      # The #25 exam reads every workflow file, so any workflow change runs it (#400).
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/ci/junit_gate.py"
      - "scripts/factory_progress.py"
      - "scripts/_hook_io.py"

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/factory-dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy build_snapshot.py
      - run: uv run pytest -q
      - name: Acceptance exam must run fully (no skips)
        run: |
          uv run pytest tests/acceptance -q --confcutdir=tests -o addopts="" --junitxml=acceptance.xml
          python3 ../../scripts/ci/junit_gate.py acceptance.xml
