name: Incident

on:
  workflow_run:
    workflows: ["CI", "Dashboard CI", "Factory dashboard", "Deploy", "Server smoke", "Server bootstrap"]
    types: [completed]

# The Deploy and Smoke workflows must be named exactly `Deploy` and `Server smoke`.
permissions:
  issues: write

jobs:
  incident:
    if: >-
      contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion) &&
      (!contains(fromJSON('["CI","Dashboard CI"]'), github.event.workflow_run.name) ||
        (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    concurrency:
      group: incident-${{ github.event.workflow_run.name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Comment on or open the incident issue
        run: |
          title="Incident: $WF_NAME failed"
          existing=$(gh issue list --state open --label type:incident --json number,title             | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title"               --label "type:incident,priority:p0,status:ready"               --body "The $WF_NAME workflow failed: $RUN_URL"
          fi
