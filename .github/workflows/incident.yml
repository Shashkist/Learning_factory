name: Incident

on:
  workflow_run:
    workflows: ["CI", "Dashboard CI", "Factory dashboard", "Deploy", "Server smoke", "Server bootstrap"]
    types: [completed]

# The Deploy and Smoke workflows must be named exactly `Deploy` and `Server smoke`.
permissions:
  actions: read
  contents: read
  issues: write

jobs:
  incident:
    if: >-
      contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion) &&
      (!contains(fromJSON('["CI","Dashboard CI"]'), github.event.workflow_run.name) ||
        (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    concurrency:
      group: incident-${{ github.event.workflow_run.name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
    steps:
      # A broken gate must never hide an incident: checkout and the gate fail open (raise).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false
      - name: Decide whether to raise
        id: gate
        run: |
          previous=none
          if [ "$WF_NAME" = "Factory dashboard" ] && [ "$RUN_EVENT" = "schedule" ]; then
            previous=$(gh run list --workflow "$WF_NAME" --event schedule --limit 20 --json databaseId,conclusion \
              | jq -r --arg id "$RUN_ID" '[.[] | select(.databaseId < ($id | tonumber) and (.conclusion | IN("", "cancelled", "skipped") | not))][0].conclusion // "none"') || previous=none
          fi
          decision=$(python3 scripts/incident_gate.py --workflow "$WF_NAME" --event "$RUN_EVENT" --previous "${previous:-none}") || decision=raise
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
      - name: Comment on or open the incident issue
        # fail open: a gate step that died before writing its decision still raises
        if: ${{ !cancelled() && (steps.gate.outputs.decision == 'raise' || steps.gate.outputs.decision == '') }}
        run: |
          title="Incident: $WF_NAME failed"
          existing=$(gh issue list --state open --label type:incident --json number,title             | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title"               --label "type:incident,priority:p0,status:ready"               --body "The $WF_NAME workflow failed: $RUN_URL"
          fi
