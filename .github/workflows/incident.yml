name: Incident

on:
  workflow_run:
    workflows: ["CI", "Dashboard CI", "Factory dashboard", "Deploy", "Server smoke", "Server bootstrap"]
    types: [completed]

# The Deploy and Smoke workflows must be named exactly `Deploy` and `Server smoke`.
permissions:
  actions: read
  contents: read
  issues: write

jobs:
  # Decide whether this run is an incident (the scheduled dashboard flake rule stays local).
  decide:
    if: >-
      contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion) &&
      (!contains(fromJSON('["CI","Dashboard CI"]'), github.event.workflow_run.name) ||
        (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
    steps:
      # A broken gate must never hide an incident: checkout and the gate fail open (raise).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false
      - name: Decide whether to raise
        id: gate
        run: |
          previous=none
          if [ "$WF_NAME" = "Factory dashboard" ] && [ "$RUN_EVENT" = "schedule" ]; then
            previous=$(gh run list --workflow "$WF_NAME" --event schedule --limit 20 --json databaseId,conclusion \
              | jq -r --arg id "$RUN_ID" '[.[] | select(.databaseId < ($id | tonumber) and (.conclusion | IN("", "cancelled", "skipped") | not))][0].conclusion // "none"') || previous=none
          fi
          decision=$(python3 scripts/incident_gate.py --workflow "$WF_NAME" --event "$RUN_EVENT" --previous "${previous:-none}") || decision=raise
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

  # The factory's reusable workflow opens or comments on the issue (#613, D165).
  # Fail open: a decide job that died before writing its decision still raises.
  incident:
    needs: decide
    if: ${{ !cancelled() && needs.decide.result != 'skipped' && (needs.decide.outputs.decision == 'raise' || needs.decide.outputs.decision == '') }}
    permissions:
      contents: read
      issues: write
    uses: Shashkist/factory/.github/workflows/incident.yml@95753bb72e9c5d885376311efea91db7272f9d16 # v0.1.0
    with:
      workflow-name: ${{ github.event.workflow_run.name }}
      run-url: ${{ github.event.workflow_run.html_url }}
      conclusion: ${{ github.event.workflow_run.conclusion }}
